name: Dynamic Daily Data Tracker

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  track-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Randomly Generate & Commit Data
        run: |
          # Set Git user to YOUR email so commits attribute to your profile graph
          git config --local user.email "chatgpt0548@gmail.com"
          git config --local user.name "MrDeving"

          # Pick a random number of commits between 1 and 6 for today
          NUM_COMMITS=$((1 + RANDOM % 6))
          echo "Generating $NUM_COMMITS commits for today's activity..."

          for i in $(seq 1 $NUM_COMMITS); do
            # Run data collector
            python tracker.py

            # Commit individual update
            git add weather_log.csv
            git commit -m "data: log metric sample $i of $NUM_COMMITS [skip ci]"

            # Small pause to ensure distinct timestamps
            sleep 2
          done

          # Push all generated commits for the day in one batch
          git push
