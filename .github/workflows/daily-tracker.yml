name: Dynamic Daily Data Tracker

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  track-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Randomly Generate & Commit Data
        run: |
          git config --local user.email "cexistaken@gmail.com"
          git config --local user.name "MrDeving"

          # Defined list of specific commit counts to hit all green shades
          CHOICES=(1 4 6 8)

          # Pick a random index from the list (0 through 6)
          RANDOM_INDEX=$((RANDOM % ${#CHOICES[@]}))
          NUM_COMMITS=${CHOICES[$RANDOM_INDEX]}

          echo "Generating $NUM_COMMITS commits for today's activity..."

          for i in $(seq 1 $NUM_COMMITS); do
            python tracker.py
            git add weather_log.csv
            git commit -m "data: log metric sample $i of $NUM_COMMITS [skip ci]"
            sleep 2
          done

          git push
